<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro-Diplomacy | Broadcast Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
<script src="/nav.js"></script>
  <div class="p-3 flex flex-col">

    <!-- GAME SELECTOR (HIDDEN WHEN WATCHING) -->
    <div id="spectatorJoinScreen" class="flex-1 flex items-center justify-center min-h-[70vh]">
      <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-2xl font-black uppercase tracking-wider text-white mb-1">Spectator Desk</h1>
        <p class="text-slate-400 text-sm mb-6">Enter a game ID to watch live commentary and gameplay.</p>

        <div id="joinForm">
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Game ID</label>
          <input type="text" id="gameIdInput" placeholder="e.g. game_1001" maxlength="32"
                 class="w-full bg-slate-950 border border-slate-700 text-sm rounded-lg px-4 py-2.5 text-white outline-none focus:border-indigo-500 transition mb-3" autocomplete="off">
          <p id="joinError" class="text-rose-400 text-xs mb-3 hidden"></p>
          <button id="joinBtn" onclick="watchGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black uppercase tracking-widest py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">
            Watch Game
          </button>
        </div>
      </div>
    </div>

    <!-- GAME VIEW (HIDDEN UNTIL CONNECTED) -->
    <div id="spectatorView" class="hidden flex-1 flex flex-col">

      <!-- Header: Game Status -->
      <header class="flex items-center justify-between gap-3 border-b border-slate-800 pb-2 mb-3">
        <div>
          <h1 class="text-lg font-black uppercase tracking-wider text-white">Spectator Desk</h1>
          <p class="text-slate-400 text-xs mt-0.5">Watching <span id="watchGameIdLabel" class="font-mono text-slate-500">-</span></p>
        </div>
        <div class="flex items-center gap-1 bg-slate-900 p-2 rounded-lg border border-slate-800 text-xs">
          <div class="text-center px-2 border-r border-slate-700">
            <span class="block text-[9px] text-slate-500 uppercase font-bold">Turn</span>
            <span class="font-black text-indigo-400 text-sm" id="turnDisplay">1</span>
          </div>
          <div class="text-center px-2 border-r border-slate-700">
            <span class="block text-[9px] text-slate-500 uppercase font-bold">Phase</span>
            <span class="font-black text-amber-400 animate-pulse text-sm" id="phaseDisplay">DIPLOMACY</span>
          </div>
          <div class="text-center px-2">
            <span class="block text-[9px] text-slate-500 uppercase font-bold">Time</span>
            <span class="font-black text-rose-400 font-mono text-sm" id="timerDisplay">00:00</span>
          </div>
        </div>
      </header>

      <!-- Live Battle Map -->
      <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-3 shadow-2xl">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Map</h2>
          <div class="text-[9px] text-slate-400 space-x-2 flex">
            <span>★ SC</span>
            <span>▲ Unit</span>
          </div>
        </div>
        <svg viewBox="0 0 800 500" class="w-full h-48 drop-shadow-lg map-svg">
          <defs>
            <style>
              .territory-node { cursor: pointer; }
              .territory-node:hover circle:first-of-type { stroke-width: 4; }
              .supply-center { filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.4)); }
            </style>
          </defs>
          <g id="mapEdgesLayer" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"></g>
          <g id="mapNodesLayer"></g>
        </svg>
      </section>


      <!-- SCOREBOARD: Supply Centers Held -->
      <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-3 shadow-2xl">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">Scores</h2>
        <div id="scoreboardDisplay" class="grid grid-cols-4 gap-2">
          <div class="text-center p-2 bg-slate-800 rounded">
            <div class="text-[9px] text-slate-500 font-bold uppercase">Red</div>
            <div class="text-lg font-black text-rose-400" id="scoreRed">0</div>
          </div>
          <div class="text-center p-2 bg-slate-800 rounded">
            <div class="text-[9px] text-slate-500 font-bold uppercase">Blue</div>
            <div class="text-lg font-black text-indigo-400" id="scoreBlue">0</div>
          </div>
          <div class="text-center p-2 bg-slate-800 rounded">
            <div class="text-[9px] text-slate-500 font-bold uppercase">Green</div>
            <div class="text-lg font-black text-emerald-400" id="scoreGreen">0</div>
          </div>
          <div class="text-center p-2 bg-slate-800 rounded">
            <div class="text-[9px] text-slate-500 font-bold uppercase">Yellow</div>
            <div class="text-lg font-black text-amber-400" id="scoreYellow">0</div>
          </div>
        </div>
      </section>

      <!-- PUBLIC CHAT & GAME EVENTS FEED -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-2xl flex flex-col gap-2">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-100">Live Feed</h3>
        </div>
      </div>

      <!-- Messages & Events -->
      <div id="liveEventsFeed" class="space-y-1 max-h-40 overflow-y-auto text-[11px]">
        <p class="text-slate-500 text-xs">Waiting for activity...</p>
      </div>

    </div>

      <!-- Exit Button -->
      <div class="flex gap-2 mt-2">
        <button onclick="stopWatching()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs px-3 py-1.5 rounded transition">
          Stop
        </button>
      </div>
    </div>
  </div>

  <script>
    let watchingGameId = null;
    let pollIntervalId = null;
    let lastSeenCommentaryIndex = -1;

    const COLORS = {
      Red: '#ef4444', Blue: '#3b82f6', Green: '#10b981', Yellow: '#f59e0b', Neutral: '#475569'
    };
    const TERRITORIES = {
      Northreach: { x: 220, y: 80, isSC: true },
      Ironpeaks: { x: 580, y: 80, isSC: true },
      Westmarch: { x: 130, y: 240, isSC: false },
      Centerlands: { x: 400, y: 240, isSC: true },
      Eastgate: { x: 670, y: 240, isSC: false },
      Sunport: { x: 220, y: 400, isSC: true },
      Southvale: { x: 400, y: 400, isSC: true },
      Duneport: { x: 580, y: 400, isSC: true }
    };

    async function watchGame() {
      const gameId = document.getElementById('gameIdInput').value.trim();
      const errorDiv = document.getElementById('joinError');
      if (!gameId) {
        errorDiv.textContent = 'Enter a game ID';
        errorDiv.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`/api/v1/games/${gameId}/state`);
        if (!res.ok) throw new Error('Game not found');

        watchingGameId = gameId;
        document.getElementById('spectatorJoinScreen').classList.add('hidden');
        document.getElementById('spectatorView').classList.remove('hidden');
        document.getElementById('watchGameIdLabel').textContent = gameId;

        lastSeenCommentaryIndex = -1;
        pollGameState();
        pollIntervalId = setInterval(pollGameState, 1000);
      } catch (err) {
        errorDiv.textContent = 'Failed to connect: ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    function stopWatching() {
      if (pollIntervalId) clearInterval(pollIntervalId);
      watchingGameId = null;
      lastSeenCommentaryIndex = -1;
      document.getElementById('spectatorJoinScreen').classList.remove('hidden');
      document.getElementById('spectatorView').classList.add('hidden');
      document.getElementById('gameIdInput').value = '';
    }

    async function pollGameState() {
      if (!watchingGameId) return;
      try {
        const res = await fetch(`/api/v1/games/${watchingGameId}/state`);
        if (!res.ok) return;
        const state = await res.json();

        document.getElementById('turnDisplay').textContent = state.turn;
        document.getElementById('phaseDisplay').textContent = state.phase;
        document.getElementById('timerDisplay').textContent = formatTime(state.time_remaining_seconds);

        renderMap(state);
        updateScoreboard(state);
        updateLiveFeed(watchingGameId, state.turn);
      } catch (err) {
        // transient network error - next tick will retry
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderMap(state) {
      const currentAdjacency = state.adjacency || TERRITORIES;
      const map = state.map || {};

      const edgesLayer = document.getElementById('mapEdgesLayer');
      edgesLayer.innerHTML = '';

      const nodePositions = state.coordinates && Object.keys(state.coordinates).length > 0
        ? state.coordinates
        : TERRITORIES;

      if (Object.keys(nodePositions).length >= 2) {
        const terrList = Object.entries(nodePositions);
        for (let i = 0; i < terrList.length; i++) {
          const [t1, pos1] = terrList[i];
          const adj = currentAdjacency[t1] || [];
          for (const t2 of adj) {
            if (t1 < t2) {
              const pos2 = nodePositions[t2];
              if (pos1 && pos2) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', pos1.x);
                line.setAttribute('y1', pos1.y);
                line.setAttribute('x2', pos2.x);
                line.setAttribute('y2', pos2.y);
                edgesLayer.appendChild(line);
              }
            }
          }
        }
      }

      const nodesLayer = document.getElementById('mapNodesLayer');
      nodesLayer.innerHTML = Object.entries(nodePositions).map(([name, pos]) => {
        const tData = map[name] || {};
        const scColor = tData.sc_owner ? COLORS[tData.sc_owner] : '#1e293b';
        const unitColor = tData.unit_faction ? COLORS[tData.unit_faction] : 'transparent';
        const isSC = (state.supply_centers || []).includes(name);
        const hasUnit = tData.unit_faction ? true : false;
        const strokeColor = isSC ? '#fbbf24' : '#475569';
        const strokeW = isSC ? '3' : '2';

        // Tooltip text
        const tooltip = `${name}${isSC ? ' (SC)' : ''} ${tData.sc_owner ? `[${tData.sc_owner}]` : ''} ${tData.unit_faction ? `▲${tData.unit_faction[0]}` : ''}`;

        let html = `<g id="node-${name}" class="territory-node" title="${tooltip}">`;

        // SC glow effect (outer ring for supply centers)
        if (isSC) {
          html += `<circle cx="${pos.x}" cy="${pos.y}" r="44" fill="none" stroke="${strokeColor}" stroke-width="1" opacity="0.4" />`;
        }

        // Territory circle
        html += `<circle cx="${pos.x}" cy="${pos.y}" r="38" fill="${scColor}" fill-opacity="0.35" stroke="${strokeColor}" stroke-width="${strokeW}" class="${isSC ? 'supply-center' : ''}" />`;

        // SC star indicator (larger and more prominent)
        if (isSC) {
          html += `<text x="${pos.x}" y="${pos.y - 46}" text-anchor="middle" font-size="18" font-weight="bold" fill="#fbbf24">★</text>`;
        }

        // Unit (if present)
        if (hasUnit) {
          html += `<circle cx="${pos.x}" cy="${pos.y}" r="22" fill="${unitColor}" stroke="#0f172a" stroke-width="3" opacity="0.9" />`;
          html += `<text x="${pos.x}" y="${pos.y + 5}" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">${tData.unit_faction[0]}</text>`;
        }

        // Territory label with background
        html += `<rect x="${pos.x - 40}" y="${pos.y + 46}" width="80" height="18" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="${isSC ? '#fbbf24' : '#475569'}" stroke-width="1" />`;
        html += `<text x="${pos.x}" y="${pos.y + 59}" text-anchor="middle" font-size="11" font-weight="bold" fill="#e2e8f0">${name}</text>`;

        html += `</g>`;
        return html;
      }).join('');
    }

    function updateScoreboard(state) {
      const scores = state.scores || {};
      document.getElementById('scoreRed').textContent = scores.Red || 0;
      document.getElementById('scoreBlue').textContent = scores.Blue || 0;
      document.getElementById('scoreGreen').textContent = scores.Green || 0;
      document.getElementById('scoreYellow').textContent = scores.Yellow || 0;
    }

    async function updateLiveFeed(gameId, currentTurn) {
      try {
        const feed = document.getElementById('liveEventsFeed');

        // Fetch public messages and events
        const messagesRes = await fetch(`/api/v1/games/${gameId}/public-messages`);
        const messagesData = messagesRes.ok ? await messagesRes.json() : { messages: [] };

        const stateRes = await fetch(`/api/v1/games/${gameId}/state`);
        const state = stateRes.ok ? await stateRes.json() : {};

        // Combine all activity with timestamps
        const allActivity = [];

        // Add events
        for (const event of state.recent_events || []) {
          allActivity.push({ type: 'event', text: event, turn: currentTurn });
        }

        // Add submitted orders (during ORDERS phase)
        if (state.phase === 'ORDERS' && state.submitted_orders) {
          for (const [faction, orders] of Object.entries(state.submitted_orders || {})) {
            for (const order of orders) {
              const target = order.target_destination || order.target_faction || order.target_source;
              const orderText = `${order.unit_territory}: ${order.action}${target ? ' → ' + target : ''}`;
              allActivity.push({ type: 'order', faction, text: orderText, turn: currentTurn });
            }
          }
        }

        // Add public messages
        for (const msg of messagesData.messages || []) {
          if (msg.recipient === 'PUBLIC') {
            allActivity.push({ type: 'message', sender: msg.sender, text: msg.content, turn: msg.turn });
          }
        }

        // Sort by turn (newer last)
        allActivity.sort((a, b) => a.turn - b.turn);

        // Build HTML with turn dividers
        let feedHTML = '';
        let lastTurn = -1;

        for (const item of allActivity.slice(-50)) {
          // Add turn divider if turn changed
          if (item.turn !== lastTurn) {
            feedHTML += `<div class="text-[8px] font-black text-indigo-500 uppercase mt-1 mb-0.5 opacity-60">
              ─ Turn ${item.turn} ─
            </div>`;
            lastTurn = item.turn;
          }

          if (item.type === 'event') {
            feedHTML += `<div class="text-[10px] text-slate-400 border-l border-slate-700 pl-2 py-0.5">
              📋 ${item.text}
            </div>`;
          } else if (item.type === 'order') {
            const factionColor = {
              'Red': 'text-rose-400',
              'Blue': 'text-indigo-400',
              'Green': 'text-emerald-400',
              'Yellow': 'text-amber-400'
            }[item.faction] || 'text-slate-400';

            feedHTML += `<div class="text-[10px] border-l border-slate-700 pl-2 py-0.5">
              <span class="font-bold ${factionColor}">${item.faction}</span>
              <span class="text-slate-500"> 🎯</span>
              <span class="text-slate-300"> ${item.text}</span>
            </div>`;
          } else {
            const factionColor = {
              'Red': 'text-rose-400',
              'Blue': 'text-indigo-400',
              'Green': 'text-emerald-400',
              'Yellow': 'text-amber-400'
            }[item.sender] || 'text-slate-400';

            feedHTML += `<div class="text-[10px] border-l border-slate-700 pl-2 py-0.5">
              <span class="font-bold ${factionColor}">${item.sender}</span>
              <span class="text-slate-500">:</span>
              <span class="text-slate-300"> ${item.text}</span>
            </div>`;
          }
        }

        if (feedHTML === '') {
          feedHTML = '<p class="text-slate-500 text-xs">No activity yet...</p>';
        }

        feed.innerHTML = feedHTML;
        // Always scroll to bottom to show latest
        feed.scrollTop = feed.scrollHeight;
      } catch (err) {
        console.error('Failed to update feed:', err);
      }
    }

    // Parse blind mode from URL params
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('game');
      blindMode = params.get('blind') === 'true';

      if (blindMode) {
        document.getElementById('treatiesDisplay').closest('section').style.display = 'none';
        const header = document.querySelector('header');
        if (header) {
          const badge = document.createElement('div');
          badge.className = 'text-xs font-black px-3 py-1 rounded-lg bg-slate-700 text-slate-300 uppercase tracking-wider';
          badge.textContent = '🔲 Blind Mode (No Treaty Info)';
          header.appendChild(badge);
        }
      }

      if (gameId) {
        document.getElementById('gameIdInput').value = gameId;
        watchGame();
      }
    });
  </script>
</body>
</html>
