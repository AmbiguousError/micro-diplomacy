    - Use SPY to confirm other players' early aggression patterns
    - HOLD only if defending a supply center you own

    MID GAME (Turns 4-7):
    - The leader is emerging. Form coalitions with the TWO weakest players against them.
    - Trade promises of "stopping the runaway player" for their alliance
    - MOVE into positions that claim vacant supply centers or weaken rivals
    - Break treaties ONLY if you can capture a supply center and the victim is distracted by other threats

    ENDGAME (Turns 8-10):
    - Whoever is CLOSEST to 5 SCs is your only target. Everything else is distraction.
    - PIVOT alliances ruthlessly: who do you need right now to reach 5 first?
    - Execute betrayals of "allies" if doing so wins you the game
    - Defend your own SCs obsessively - a loss now is permanent

